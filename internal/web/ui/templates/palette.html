{{define "palette.html"}}
<dialog class="command-palette" data-command-palette aria-labelledby="palette-title">
  <h2 id="palette-title" class="visually-hidden">Command palette</h2>
  <input class="palette-input" type="text" data-palette-input
         role="combobox" aria-expanded="true" aria-controls="palette-results"
         aria-autocomplete="list" autocomplete="off" spellcheck="false"
         aria-label="Search pages, sources, and actions"
         placeholder="Search pages, sources, and actions…">
  <ul class="palette-results" id="palette-results" role="listbox"
      aria-label="Matching commands" data-palette-results></ul>
  <p class="palette-empty field-help" data-palette-empty hidden>No matching commands.</p>
</dialog>
{{end}}
