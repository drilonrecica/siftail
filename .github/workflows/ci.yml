name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Least privilege: every job only reads the repository. A job that needs more
# must declare it itself.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, vet, test, and build
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install build dependencies for CGO
        run: sudo apt-get update && sudo apt-get install -y gcc libc6-dev

      - name: Verify formatting
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Test
        run: make test

      - name: Build with artifact metadata
        run: make build

      - name: Verify artifact metadata
        run: ./siftail version

      - name: Validate Docker Compose deployment
        run: make compose-check

  govulncheck:
    name: Go vulnerability check
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install build dependencies for CGO
        run: sudo apt-get update && sudo apt-get install -y gcc libc6-dev

      - name: Verify module checksums
        run: go mod verify

      # A reachable vulnerability fails the job (AGENTS.md section 21).
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  race:
    name: Race tests
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install build dependencies for CGO
        run: sudo apt-get update && sudo apt-get install -y gcc libc6-dev

      - name: Race tests
        run: make race-test

  browser:
    name: Browser security and accessibility
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install build dependencies for CGO
        run: sudo apt-get update && sudo apt-get install -y gcc libc6-dev

      - name: Install development-only browser dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify browser suite discovery
        run: make frontend-check

      - name: Run browser suite
        run: make playwright

      - name: Upload browser review artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-review
          if-no-files-found: ignore
          path: |
            .playwright-artifacts/
            playwright-report/
            test-results/
