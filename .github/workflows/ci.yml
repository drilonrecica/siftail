name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  check:
    name: Format, vet, and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Install build dependencies for CGO
        run: sudo apt-get update && sudo apt-get install -y gcc libc6-dev

      - name: Verify formatting
        run: make fmt

      - name: Vet
        run: make vet

      - name: Test
        run: make test

  race:
    name: Race tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Install build dependencies for CGO
        run: sudo apt-get update && sudo apt-get install -y gcc libc6-dev

      - name: Race tests
        run: make race-test
