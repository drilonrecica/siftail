name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  check:
    name: Format, vet, test, and build
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install build dependencies for CGO
        run: sudo apt-get update && sudo apt-get install -y gcc libc6-dev

      - name: Verify formatting
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Test
        run: make test

      - name: Build with artifact metadata
        run: make build

      - name: Verify artifact metadata
        run: ./siftail version

  race:
    name: Race tests
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install build dependencies for CGO
        run: sudo apt-get update && sudo apt-get install -y gcc libc6-dev

      - name: Race tests
        run: make race-test
