name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  check:
    name: Format, vet, test, and build
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install build dependencies for CGO
        run: sudo apt-get update && sudo apt-get install -y gcc libc6-dev

      - name: Verify formatting
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Test
        run: make test

      - name: Build with artifact metadata
        run: make build

      - name: Verify artifact metadata
        run: ./siftail version

      - name: Validate Docker Compose deployment
        run: make compose-check

  race:
    name: Race tests
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install build dependencies for CGO
        run: sudo apt-get update && sudo apt-get install -y gcc libc6-dev

      - name: Race tests
        run: make race-test

  browser:
    name: Browser security and accessibility
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install build dependencies for CGO
        run: sudo apt-get update && sudo apt-get install -y gcc libc6-dev

      - name: Install development-only browser dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify browser suite discovery
        run: make frontend-check

      - name: Run browser suite
        run: make playwright

      - name: Upload browser review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-review
          if-no-files-found: ignore
          path: |
            .playwright-artifacts/
            playwright-report/
            test-results/
