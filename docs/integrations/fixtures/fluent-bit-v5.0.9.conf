# Compatibility fixture only. Merge the output into an owned Fluent Bit
# pipeline and replace deployment-specific values through SFT-036 guidance.
[SERVICE]
    Flush                     2
    Daemon                    Off
    Log_Level                 info
    storage.path              /var/lib/fluent-bit/siftail
    storage.sync              normal
    storage.checksum          off
    storage.max_chunks_up     16
    storage.backlog.mem_limit 16M

[INPUT]
    Name         forward
    Listen       0.0.0.0
    Port         24224
    storage.type filesystem

[OUTPUT]
    Name                     http
    Match                    *
    Host                     logs.example.com
    Port                     443
    URI                      /api/v1/ingest
    Format                   json_lines
    json_date_key            date
    json_date_format         iso8601
    Compress                 gzip
    Header                   Content-Type application/x-ndjson
    Header                   Authorization Bearer ${SIFTAIL_INGEST_TOKEN}
    tls                      On
    Retry_Limit              False
    storage.total_limit_size 256M
