# Compatibility fixture only. SFT-036 will generate deployment-specific values.
# Coolify resource requirement: set COOLIFY_APP_NAME=siftail-self on Siftail.
[SERVICE]
    Flush                     2
    Daemon                    Off
    Log_Level                 info
    storage.path              /tmp/siftail-fluent-bit
    storage.sync              normal
    storage.checksum          off
    storage.max_chunks_up     16
    storage.backlog.mem_limit 16M

[INPUT]
    Name              forward
    Listen            0.0.0.0
    Port              24224
    Buffer_Chunk_Size 1M
    Buffer_Max_Size   6M
    storage.type      filesystem

# This filter must stay before the modify filter. The marker is deliberately
# exact: an unrelated application whose name merely contains "siftail" remains.
[FILTER]
    Name    grep
    Match   *
    Exclude COOLIFY_APP_NAME ^siftail-self$

[FILTER]
    Name   modify
    Match  *
    Rename COOLIFY_APP_NAME coolify.app_name
    Rename COOLIFY_PROJECT_NAME coolify.project_name
    Rename COOLIFY_SERVER_IP coolify.server_ip
    Rename COOLIFY_ENVIRONMENT_NAME coolify.environment_name

[OUTPUT]
    Name                     http
    Match                    *
    Host                     logs.example.com
    Port                     443
    URI                      /api/v1/ingest
    Format                   json_lines
    json_date_key            date
    json_date_format         iso8601
    Compress                 gzip
    Header                   Content-Type application/x-ndjson
    Header                   Authorization Bearer ${SIFTAIL_INGEST_TOKEN}
    tls                      On
    Retry_Limit              False
    storage.total_limit_size 256M
